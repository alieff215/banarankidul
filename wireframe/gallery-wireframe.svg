<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800">
  <style>
    .box { fill:#f5f5f5; stroke:#333; stroke-width:2; }
    .header { fill:#e0e0e0; }
    .title { font-family:Segoe UI, Arial; font-size:22px; font-weight:bold; }
    .label { font-family:Segoe UI, Arial; font-size:16px; }
  </style>

  <!-- Header -->
  <rect class="box header" x="80" y="60" width="1040" height="80" rx="8"/>
  <text class="title" x="110" y="110">HEADER – Galeri Kegiatan</text>

  <!-- Hero Slider Galeri -->
  <rect class="box" x="80" y="170" width="1040" height="260" rx="8"/>
  <text class="title" x="110" y="210">HERO SLIDER GALERI</text>
  <text class="label" x="110" y="240">Background berganti dari semua gambar galeri</text>

  <!-- Grid Galeri -->
  <rect class="box" x="80" y="460" width="1040" height="540" rx="8"/>
  <text class="title" x="110" y="500">GRID KARTU GALERI</text>
  <rect class="box" x="110" y="530" width="300" height="210" rx="6"/>
  <rect class="box" x="450" y="530" width="300" height="210" rx="6"/>
  <rect class="box" x="790" y="530" width="300" height="210" rx="6"/>
  <rect class="box" x="110" y="770" width="300" height="210" rx="6"/>
  <rect class="box" x="450" y="770" width="300" height="210" rx="6"/>
  <rect class="box" x="790" y="770" width="300" height="210" rx="6"/>

  <!-- Footer -->
  <rect class="box header" x="80" y="1060" width="1040" height="180" rx="8"/>
  <text class="title" x="110" y="1100">FOOTER</text>
  <text class="label" x="110" y="1130">Tentang Kami | Kontak | Ikuti Kami</text>
  <text class="label" x="110" y="1170">©2026 KKN UAD R 155 I.D.3 | Dukuh Banaran Kidul.</text>
</svg>
