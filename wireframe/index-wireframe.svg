<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2000">
  <style>
    .box { fill:#f5f5f5; stroke:#333; stroke-width:2; }
    .header { fill:#e0e0e0; }
    .title { font-family:Segoe UI, Arial; font-size:22px; font-weight:bold; }
    .label { font-family:Segoe UI, Arial; font-size:16px; }
  </style>

  <!-- Header -->
  <rect class="box header" x="80" y="60" width="1040" height="80" rx="8"/>
  <text class="title" x="110" y="110">HEADER – Logo + Menu (Beranda, Profil, Potensi, Kontak)</text>

  <!-- Hero Slider -->
  <rect class="box" x="80" y="170" width="1040" height="260" rx="8"/>
  <text class="title" x="110" y="210">HERO SLIDER</text>
  <text class="label" x="110" y="240">Judul besar + subjudul + tombol "Tentang Kami"</text>
  <circle cx="580" cy="400" r="6" fill="#999"/>
  <circle cx="610" cy="400" r="6" fill="#ccc"/>
  <circle cx="640" cy="400" r="6" fill="#ccc"/>

  <!-- Stats -->
  <rect class="box" x="80" y="460" width="1040" height="120" rx="8"/>
  <text class="title" x="110" y="500">STATISTIK</text>
  <text class="label" x="110" y="530">4 kotak: Penduduk, KK, RT, RW</text>

  <!-- Berita Terkini -->
  <rect class="box" x="80" y="610" width="1040" height="260" rx="8"/>
  <text class="title" x="110" y="650">BERITA TERKINI – Grid 3 kartu</text>
  <rect class="box" x="110" y="670" width="280" height="170" rx="6"/>
  <rect class="box" x="460" y="670" width="280" height="170" rx="6"/>
  <rect class="box" x="810" y="670" width="280" height="170" rx="6"/>

  <!-- Potensi Unggulan -->
  <rect class="box" x="80" y="900" width="1040" height="260" rx="8"/>
  <text class="title" x="110" y="940">POTENSI UNGGULAN – Grid 3 kartu</text>

  <!-- Layanan Publik -->
  <rect class="box" x="80" y="1190" width="1040" height="230" rx="8"/>
  <text class="title" x="110" y="1230">LAYANAN PUBLIK – 3 kartu layanan</text>

  <!-- Footer -->
  <rect class="box header" x="80" y="1460" width="1040" height="180" rx="8"/>
  <text class="title" x="110" y="1500">FOOTER</text>
  <text class="label" x="110" y="1530">Tentang Kami | Kontak | Ikuti Kami</text>
  <text class="label" x="110" y="1570">©2026 KKN UAD R 155 I.D.3 | Dukuh Banaran Kidul. All rights reserved.</text>
</svg>
